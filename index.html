<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Real-Time Air Quality Index</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>Real-Time Air Quality Index</h1>
    </header>
    <div class="container">
        <div class="card">
            <h2>Air Quality Data</h2>
            <div id="data-container" class="table-container">
                <p class="loader">Loading data, please wait...</p>
            </div>
        </div>

        <div class="card">
            <h2>Pollutant Trends</h2>
            <div id="chart-container">
                <canvas id="pollutantChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
